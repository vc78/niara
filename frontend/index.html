  <body>
    <div id="root"></div>
    <div id="error-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(255,0,0,0.9); color:white; z-index:9999; padding:20px; font-family:monospace; white-space:pre-wrap; overflow:auto;"></div>
    <script>
      window.addEventListener('error', function(event) {
        document.getElementById('error-overlay').style.display = 'block';
        document.getElementById('error-overlay').innerText += '\n' + event.error.stack;
      });
      window.addEventListener('unhandledrejection', function(event) {
        document.getElementById('error-overlay').style.display = 'block';
        document.getElementById('error-overlay').innerText += '\n' + event.reason.stack;
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
